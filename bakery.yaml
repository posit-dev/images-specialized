#######################################################################################################################
# BAKERY REPOSITORY CONFIG
#
# This file is used to define global properties for builds inside a repo managed by Posit's Bakery tool.
#######################################################################################################################

# Define properties of the local repository. This information will be used when labeling image builds.
repository:
  url: "github.com/posit-dev/images-specialized"
  vendor: "Posit Software, PBC"
  maintainer: "Posit Docker Team <docker@posit.co>"
  authors:
    - name: Ian H. Pittwood
      email: ian.pittwood@posit.co
    - name: Ben Schwedler
      email: ben@posit.co

# Define image registries used by builds in this repository. Images will be tagged appropriately for each registry.
# Logins for private registries should be managed independently of Bakery.
registries:
  - host: "ghcr.io"
    namespace: "posit-dev"

images:
  - name: workbench-for-google-cloud-workstations
    displayName: "Workbench for Google Cloud Workstations"
    description: "A container image for use with Google Cloud Workstations, based
      on the Posit Workbench image with additional tools and configurations for use
      in the Google Cloud Workstations environment."
    documentationUrl: "https://docs.cloud.google.com/workstations/docs/develop-code-using-posit-workbench-rstudio"
    extraRegistries:
      - host: "us-central1-docker.pkg.dev"
        namespace: "posit-images/cloud-workstations"
        repository: "workbench"
      - host: "us-docker.pkg.dev"
        namespace: "posit-images/cloud-workstations"
        repository: "workbench"
      - host: "europe-docker.pkg.dev"
        namespace: "posit-images/cloud-workstations"
        repository: "workbench"
      - host: "asia-docker.pkg.dev"
        namespace: "posit-images/cloud-workstations"
        repository: "workbench"
    dependencyConstraints:
      - dependency: R
        constraint:
          latest: true
      - dependency: python
        constraint:
          latest: true
    variants:
      - name: Standard
        extension: std
        tagDisplayName: std
        primary: true
        options:
          - tool: goss
            wait: 30
            command: "/usr/bin/supervisord -c /etc/supervisor/supervisord.conf"
      - name: Minimal
        extension: min
        tagDisplayName: min
    versions:
      - name: 2026.08.2+200.pro1
        subpath: '2026.08'
        latest: true
        os:
          - name: Ubuntu 24.04
            primary: true
        dependencies:
          - dependency: R
            version: 4.6.1
          - dependency: python
            version: 3.14.7
  - name: workbench-for-microsoft-azure-ml
    description: A professional integrated development environment for data
      science teams using R and Python on Azure ML
    documentationUrl: https://posit.co/solutions/azure-ml
    dependencyConstraints:
      - dependency: R
        constraint:
          latest: true
      - dependency: python
        constraint:
          latest: true
    variants:
      - name: Standard
        extension: std
        tagDisplayName: std
        primary: true
        options:
          - tool: goss
            wait: 30
            command: "/usr/bin/supervisord -c /etc/supervisor/supervisord.conf"
      - name: Minimal
        extension: min
        tagDisplayName: min
    versions:
      - name: 2026.08.2+200.pro1
        subpath: '2026.08'
        latest: true
        os:
          - name: Ubuntu 24.04
            primary: true
        dependencies:
          - dependency: R
            version: 4.6.1
          - dependency: python
            version: 3.14.7
  - name: positron-sagemaker
    displayName: Positron on SageMaker
    description: A custom JupyterLab image that runs Posit's Positron IDE inside
      Amazon SageMaker Studio, built on the sagemaker-distribution base image.
    documentationUrl: https://github.com/posit-dev/positron-sagemaker
    # SOCI-index the pushed images so SageMaker Studio / ECR can lazily pull
    # layers. Applied to the final tags by the merge job's `bakery ci publish`
    # (oras index-create -> soci-convert -> index-copy). See
    # .github/workflows/positron-sagemaker.yml.
    options:
      - tool: soci
        enabled: true
    extraRegistries:
      - host: "public.ecr.aws"
        namespace: "m0i8p2s7"
        repository: "positron-sagemaker"
    dependencyConstraints:
      - dependency: quarto
        constraint:
          latest: true
      - dependency: R
        constraint:
          latest: true
    devVersions:
      - sourceType: dependency
        dependency: positron
        prerelease: true
        channel: daily
        values:
          POSITRON_CHANNEL: dailies
        os:
          - name: Ubuntu 24.04
            primary: true
            platforms:
              - linux/amd64
        overrideRegistries:
          - host: "ghcr.io"
            namespace: "posit-dev"
            repository: "positron-sagemaker-preview"
          # Internal-only ECR repo used to validate the image against SageMaker
          # Studio before it's promoted anywhere customer-facing. Requires the
          # `development` environment's AWS_ROLE secret to push (see
          # development-positron-sagemaker.yml).
          - host: "935931255537.dkr.ecr.us-east-2.amazonaws.com"
            repository: "positron-sagemaker-preview"
    versions:
      - name: 2026.08.2-4
        subpath: '2026.08'
        latest: true
        os:
          - name: Ubuntu 24.04
            primary: true
            platforms:
              - linux/amd64
        dependencies:
          - dependency: quarto
            version: 1.10.18
          - dependency: R
            version: 4.6.1
  - name: session-complete
    displayName: "Posit Workbench Session Complete"
    description: "A Posit Workbench session image with a full Workbench installation
      layered on, so the session components ship in the image and sessions run without
      a workbench-session-init init container alongside them. Mirrors the Workbench
      installation used by the r-session-complete image on a workbench-session base."
    documentationUrl: "https://docs.posit.co/ide/server-pro/integration/kubernetes.html"
    variants:
      - name: Standard
        extension: std
        tagDisplayName: std
        primary: true
      - name: Minimal
        extension: min
        tagDisplayName: min
    # No `options` here:
    #   * goss -- unlike the other images in this repository, a session image
    #     starts no long-running service of its own (the Job Launcher execs a
    #     session per request), so there is nothing to start and nothing to wait
    #     for. dgoss runs the default `sleep infinity` and the suite is purely
    #     structural.
    #   * soci -- deliberately not enabled yet. This image is large enough that
    #     lazy layer pulls would help (the upstream workbench-session and
    #     workbench-session-init images both enable it), so it is worth
    #     revisiting, but it is left off until the image itself is settled.
    versions:
      # The version is the WORKBENCH release, used verbatim as the apt version
      # pin for the rstudio-server package in scripts/install_workbench.sh.
      # It is not an R/Python matrix coordinate -- those come from whichever
      # workbench-session base build the OS-qualified tag resolves to.
      - name: 2026.08.2+200.pro1
        subpath: '2026.08'
        latest: true
        os:
          - name: Ubuntu 26.04
            primary: true
            platforms:
              - linux/amd64

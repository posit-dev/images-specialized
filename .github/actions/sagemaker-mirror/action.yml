name: Mirror positron-sagemaker to private ECR
description: >
  Pulls a specific tag of public.ecr.aws/posit/positron-sagemaker into a
  private ECR repository and registers a SageMaker ImageVersion. Skips both
  steps if the tag already exists in the private registry. Requires AWS
  credentials to be configured by the calling workflow.

inputs:
  tag:
    description: Version tag to mirror (e.g. 2026.09.0-124).
    required: true
  source-image:
    description: Public ECR image URI without tag.
    default: public.ecr.aws/posit/positron-sagemaker
  target-ecr-registry:
    description: >
      Private ECR registry host
      (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com).
      The AWS region and account ID are derived from this value and used for
      all ECR and SageMaker API calls, so they are always consistent.
    required: true
  target-repository:
    description: Repository name in the private ECR registry.
    default: positron-sagemaker
  sagemaker-image-name:
    description: Name of the SageMaker catalog image to register versions against.
    default: positron-sagemaker

outputs:
  pushed:
    description: "'true' if a new version was pushed; 'false' if the tag already existed."
    value: ${{ steps.check.outputs.pushed }}

runs:
  using: composite
  steps:
    - name: Check if tag already in private ECR
      id: check
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        REPO: ${{ inputs.target-repository }}
        REGISTRY: ${{ inputs.target-ecr-registry }}
      run: |
        # Derive the region from the registry hostname:
        # <account>.dkr.ecr.<region>.amazonaws.com -> field 4
        REGION=$(echo "$REGISTRY" | cut -d. -f4)

        set +e
        ERR=$(aws ecr describe-images \
          --repository-name "$REPO" \
          --image-ids "imageTag=$TAG" \
          --region "$REGION" \
          --output text 2>&1)
        EXIT_CODE=$?
        set -e

        if [[ $EXIT_CODE -eq 0 ]]; then
          echo "Tag $TAG already in $REPO — nothing to do."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
        elif echo "$ERR" | grep -q "ImageNotFoundException"; then
          echo "Tag $TAG not found in $REPO — mirroring."
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        else
          echo "::error::ECR check failed: $ERR"
          exit 1
        fi

    - name: Parse registry
      id: registry
      shell: bash
      env:
        REGISTRY: ${{ inputs.target-ecr-registry }}
      run: |
        # Extract the account ID from the registry hostname so it can be
        # passed to amazon-ecr-login, which scopes login to that account only.
        # Hostname format: <account>.dkr.ecr.<region>.amazonaws.com
        echo "account=$(echo "$REGISTRY" | cut -d. -f1)" >> "$GITHUB_OUTPUT"

    - name: Setup ORAS
      if: steps.check.outputs.pushed == 'true'
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

    - name: Login to Amazon ECR
      if: steps.check.outputs.pushed == 'true'
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6
      with:
        registries: ${{ steps.registry.outputs.account }}

    - name: Copy from public ECR to private ECR
      if: steps.check.outputs.pushed == 'true'
      timeout-minutes: 30
      shell: bash
      env:
        SOURCE: ${{ inputs.source-image }}:${{ inputs.tag }}
        TARGET: ${{ inputs.target-ecr-registry }}/${{ inputs.target-repository }}:${{ inputs.tag }}
      run: |
        # oras copy --recursive preserves the full OCI artifact tree: the image
        # index, the linux/amd64 manifest, and the SOCI index that SageMaker
        # Studio uses for lazy image loading. docker pull/push would strip the
        # SOCI index and collapse a multi-platform index to a single manifest.
        oras copy --recursive "$SOURCE" "$TARGET"

    - name: Register SageMaker ImageVersion
      if: steps.check.outputs.pushed == 'true'
      shell: bash
      env:
        SAGEMAKER_IMAGE: ${{ inputs.sagemaker-image-name }}
        BASE_IMAGE: ${{ inputs.target-ecr-registry }}/${{ inputs.target-repository }}:${{ inputs.tag }}
        REGISTRY: ${{ inputs.target-ecr-registry }}
      run: |
        REGION=$(echo "$REGISTRY" | cut -d. -f4)

        VERSION=$(aws sagemaker create-image-version \
          --image-name "$SAGEMAKER_IMAGE" \
          --base-image "$BASE_IMAGE" \
          --region "$REGION" \
          --query 'ImageVersionArn' --output text | awk -F/ '{print $NF}')

        echo "Waiting for ImageVersion $VERSION to settle..."

        # create-image-version exits 0 and returns an ARN even when the image
        # is unreachable — the actual failure surfaces asynchronously via
        # ImageVersionStatus. Poll until CREATED or CREATE_FAILED.
        # Note: --version-number, not --version; the global AWS CLI --version
        # flag silently shadows --version and exits 0 with the CLI version string.
        for _ in $(seq 30); do
          read -r STATUS REASON < <(aws sagemaker describe-image-version \
            --image-name "$SAGEMAKER_IMAGE" \
            --version-number "$VERSION" \
            --region "$REGION" \
            --query '[ImageVersionStatus, FailureReason]' \
            --output text)
          [[ "$STATUS" == "CREATED" ]] && { echo "ImageVersion $VERSION created."; exit 0; }
          [[ "$STATUS" == "CREATE_FAILED" ]] && { echo "::error::ImageVersion $VERSION failed: $REASON"; exit 1; }
          sleep 10
        done

        echo "::error::Timed out waiting for ImageVersion $VERSION (last status: $STATUS)"
        exit 1

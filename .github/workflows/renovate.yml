name: Renovate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    # Only run against the canonical repository, where the GitHub App is installed.
    if: github.repository == 'posit-dev/images-specialized'
    runs-on: ubuntu-latest
    steps:
      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.POSIT_PLATFORM_CLIENT_ID }}
          private-key: ${{ secrets.POSIT_PLATFORM_PEM }}
          # Renovate only creates branches and pull requests in this repository.
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9  # v46.3.8
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}

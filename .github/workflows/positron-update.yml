name: Positron Update
on:
  workflow_dispatch:

  schedule:
    # Daily -- this is a cheap version-check, not a full image build (unlike
    # the weekly WGCW/WAML rebuild schedules), so there's no cost reason to
    # wait a week to notice a new Positron release.
    - cron: "30 4 * * *" # At 04:30 daily

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Security policy: No ${{ }} expressions in `run:` blocks.
# All expression values are assigned to `env:` and referenced as
# shell variables. This prevents script injection from runtime values
# and keeps the rule enforceable by zizmor without per-expression exceptions.

jobs:
  update:
    name: Check for Positron update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.WORKBENCH_IDE_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.WORKBENCH_IDE_RELEASE_PEM }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install bakery
        uses: "posit-dev/images-shared/setup-bakery@main"

      # Compares the CDN's newest Positron release against what's pinned in
      # bakery.yaml. The pwb (Workbench) release manifest is used rather than
      # a "server" one because no such manifest exists (probed and confirmed
      # 403 earlier this epic) -- the pwb and server release trains share the
      # same version numbers even though this image installs a different
      # artifact (the plain server tarball, not the pwb bundle).
      - name: Detect latest Positron version
        id: positron
        run: |
          CURRENT_VERSION=$(bakery get version positron-sagemaker)
          MANIFEST=$(curl -sf "https://cdn.posit.co/positron/releases/pwb/x86_64/all-releases.json")

          # Version-aware max, not "first in list": splits each version into
          # (release, build) -- e.g. "2026.08.1-2" -> release "2026.08.1",
          # build "2" -- and compares numerically, since the manifest's
          # ordering is not guaranteed.
          LATEST_VERSION=$(echo "$MANIFEST" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          versions = [r['version'] for r in data['releases']]

          def sort_key(v):
              release, _, build = v.partition('-')
              release_parts = tuple(int(x) for x in release.split('.'))
              build_part = int(build) if build else 0
              return (release_parts, build_part)

          versions.sort(key=sort_key)
          print(versions[-1])
          ")

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "Up to date ($CURRENT_VERSION); nothing to do."
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Update available: $CURRENT_VERSION -> $LATEST_VERSION"

          # Matches the EDITION/DISPLAY_VERSION convention used in
          # release.yml/product-release.yml: strip any +/- build suffix, then
          # the trailing patch segment, to get the YYYY.MM subpath.
          DISPLAY_VERSION="${LATEST_VERSION%%[+-]*}"
          EDITION="${DISPLAY_VERSION%.*}"

          OLD_DISPLAY="${CURRENT_VERSION%%[+-]*}"
          OLD_EDITION="${OLD_DISPLAY%.*}"

          {
            echo "update_needed=true"
            echo "current_version=$CURRENT_VERSION"
            echo "latest_version=$LATEST_VERSION"
            echo "edition=$EDITION"
            echo "old_edition=$OLD_EDITION"
          } >> "$GITHUB_OUTPUT"

      # The sagemaker-distribution base image pin is bumped separately by
      # Renovate (see renovate.json's custom manager on the Containerfiles),
      # so this workflow only tracks the Positron version.

      # Mirrors release.yml's version-replacement strategy: a same-edition
      # bump patches the existing version in place (preserving the pinned
      # quarto/R dependency resolution), while an edition bump creates a new
      # version (letting dependencyConstraints re-resolve) and removes the
      # old one, rather than leaving both versions checked in.
      - name: Replace version
        if: steps.positron.outputs.update_needed == 'true'
        env:
          OLD_VERSION: ${{ steps.positron.outputs.current_version }}
          NEW_VERSION: ${{ steps.positron.outputs.latest_version }}
          EDITION: ${{ steps.positron.outputs.edition }}
          OLD_EDITION: ${{ steps.positron.outputs.old_edition }}
        run: |
          if [ "$OLD_EDITION" = "$EDITION" ]; then
            echo "Patching positron-sagemaker: $OLD_VERSION -> $NEW_VERSION"
            bakery update version positron-sagemaker "$NEW_VERSION" --target-version "$OLD_VERSION"
          else
            echo "Replacing positron-sagemaker: $OLD_VERSION -> $NEW_VERSION (subpath=$EDITION)"
            bakery create version positron-sagemaker "$NEW_VERSION" --subpath "$EDITION" --mark-latest
            bakery remove version positron-sagemaker "$OLD_VERSION"
          fi

      # Stage the generated files so edition bumps include the new (initially
      # untracked) version and Git can detect the old version as a rename.
      - name: Capture rendered diff
        if: steps.positron.outputs.update_needed == 'true'
        run: |
          git add -A -- positron-sagemaker
          git diff --cached --find-renames -- positron-sagemaker > "$RUNNER_TEMP/diff-positron-sagemaker.md" || true

      - name: Create pull request
        if: steps.positron.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OLD_VERSION: ${{ steps.positron.outputs.current_version }}
          NEW_VERSION: ${{ steps.positron.outputs.latest_version }}
        run: |
          # Authenticate individual git network commands via an inline
          # header rather than persisting the token in .git/config (which
          # would remain readable, e.g. by any later artifact upload, for
          # the rest of the job).
          AUTH_HEADER="AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_TOKEN}" | base64 -w0)"

          BRANCH="positron-update-${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Bump Positron to ${NEW_VERSION}"
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push -u origin "$BRANCH" --force-with-lease

          BODY="Bumps Positron on SageMaker from \`${OLD_VERSION}\` to \`${NEW_VERSION}\`."
          BODY+=$'\n\n'"Opened automatically by the update workflow. Requires human review before merging."

          gh pr create \
            --title "Bump Positron to ${NEW_VERSION}" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH" || echo "PR already exists"

      # Same marker-based idempotent comment pattern as
      # product-release.yml, so re-running the workflow (e.g. before the PR
      # is reviewed) updates the same comment instead of piling up duplicates.
      - name: Post or update diff comment
        if: steps.positron.outputs.update_needed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_VERSION: ${{ steps.positron.outputs.latest_version }}
        run: |
          BRANCH="positron-update-${NEW_VERSION}"
          MARKER="<!-- bakery-release-diff -->"
          DIFF_FILE="$RUNNER_TEMP/diff-positron-sagemaker.md"

          if [ ! -s "$DIFF_FILE" ]; then
            echo "No diff content generated; skipping comment."
            exit 0
          fi

          BODY_FILE="$RUNNER_TEMP/diff-comment.md"
          {
            echo "$MARKER"
            echo "## Rendered file changes"
            echo
            echo '```diff'
            cat "$DIFF_FILE"
            echo '```'
          } > "$BODY_FILE"

          PR_NUMBER=$(gh pr view "$BRANCH" --json number -q .number)

          EXISTING_COMMENT_ID=$(gh api "repos/{owner}/{repo}/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id")

          if [ -n "$EXISTING_COMMENT_ID" ] && [ "$EXISTING_COMMENT_ID" != "null" ]; then
            gh api "repos/{owner}/{repo}/issues/comments/$EXISTING_COMMENT_ID" \
              -X PATCH -F body=@"$BODY_FILE"
          else
            gh pr comment "$BRANCH" --body-file "$BODY_FILE"
          fi

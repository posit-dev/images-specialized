name: Positron SageMaker
on:
  workflow_dispatch:

  schedule:
    # Weekly rebuild, to pick up any upstream changes. Runs ahead of WGCW
    # (04:15) and WAML (04:45) so this image's build/test/push completes
    # before the rest of the specialized-hour rebuilds begin.
    - cron: "45 3 * * 0" # At 03:45 on Sunday

  push:
    branches:
      - main


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true


# Matches images-shared's build workflows: GitHub's default Linux shell is
# `bash -e`, which leaves pipefail off, so a failing first stage of a pipeline
# is silently swallowed. `shell: bash` is `bash --noprofile --norc -eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    # This should be the only action checked as required in the repo settings.
    #
    # This is a meta-job, here to express the conditions we require
    # in order to consider a CI run to be successful.
    if: always()

    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    needs:
      - matrix
      - build
      - merge

    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        id: alls-green
        with:
          jobs: ${{ toJSON(needs) }}
          # Two expected skips, neither of which should fail the required check:
          #   * merge only runs on the push/schedule paths, so it skips on a
          #     workflow_dispatch from a branch other than main.
          #   * build and merge both skip when the change-aware matrix is empty
          #     (a push to main that didn't touch this image).
          # `matrix` is in needs above so a failure there still blocks; this
          # only forgives a genuine no-op.
          allowed-skips: build, merge
      - if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: posit-dev/images-shared/.github/actions/slack-build-notify@main
        with:
          result: ${{ steps.alls-green.outcome }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  matrix:
    name: Image Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history so the change-aware diff below can reach the base ref.
          fetch-depth: 0

      - name: Install
        uses: "posit-dev/images-shared/setup-bakery@main"

      - name: Images
        id: images
        env:
          DEV_VERSIONS: "exclude"
          MATRIX_VERSIONS: "exclude"
          IMAGE_NAME: "positron-sagemaker"
          # Change-aware builds, matching bakery-build-native.yml. Only set on
          # push events, so schedule/workflow_dispatch still build the full
          # matrix. github.event.before is also populated on pull_request
          # synchronize, so it must be gated on event_name rather than checked
          # for presence alone. A bad or all-zero ref is caught by bakery's
          # git-diff fail-safe, which falls back to a full build.
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          ARGS=(--quiet --dev-versions "$DEV_VERSIONS" --matrix-versions "$MATRIX_VERSIONS")
          if [ -n "$BASE_REF" ]; then
            ARGS+=(--base-ref "$BASE_REF")
          fi
          ARGS+=(-- "$IMAGE_NAME")
          # Assign first, then echo. A command substitution used as an argument
          # to echo cannot fail the step under `set -e` -- a bakery or jq
          # failure would write an empty matrix, pass this job, and only
          # surface as a fromJson('') error over in build. Assigning it, with
          # pipefail from `defaults` above, fails the step here instead.
          MATRIX=$(bakery ci matrix "${ARGS[@]}" | jq --compact-output .)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: "${{ matrix.img.image }}:${{ matrix.img.version }}"
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: matrix
    # GitHub Actions fails (not skips) a matrix job when the matrix evaluates
    # to []. Guard here so a push that didn't touch this image produces
    # 'skipped' instead of 'failure'.
    if: ${{ needs.matrix.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest-4x
    strategy:
      fail-fast: false
      matrix:
        img: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bakery
        uses: "posit-dev/images-shared/setup-bakery@main"

      - name: Setup goss
        uses: "posit-dev/images-shared/setup-goss@main"

      # Temp images are pushed to ghcr (GITHUB_TOKEN) only; the final push to the
      # customer-facing public ECR happens in the `merge` job, which owns the
      # production AWS_ROLE. So this job needs no AWS credentials -- the
      # sagemaker-distribution base image pulls anonymously from ECR Public.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build
        env:
          GIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ matrix.img.image }}
          IMAGE_VERSION: ${{ matrix.img.version }}
          DEV_VERSIONS: "exclude"
          MATRIX_VERSIONS: "exclude"
        run: |
          bakery build --load --pull \
            --retry 1 \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS"

      - name: Test
        env:
          IMAGE_NAME: ${{ matrix.img.image }}
          IMAGE_VERSION: ${{ matrix.img.version }}
          DEV_VERSIONS: "exclude"
          MATRIX_VERSIONS: "exclude"
        run: |
          GOSS_PATH=${GITHUB_WORKSPACE}/tools/goss \
          DGOSS_PATH=${GITHUB_WORKSPACE}/tools/dgoss \
          bakery dgoss run \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS"

      # Push per-platform temp images to the temp registry (ghcr) and record
      # build metadata. The final product tags are NOT created here -- the
      # `merge` job SOCI-converts these temp images and lands them on the real
      # ghcr + public ECR tags via `bakery ci publish`.
      - name: Push
        # Push images only for merges into main and weekly scheduled re-builds.
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        env:
          GIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ matrix.img.image }}
          IMAGE_VERSION: ${{ matrix.img.version }}
          DEV_VERSIONS: "exclude"
          MATRIX_VERSIONS: "exclude"
          TEMP_REGISTRY: "ghcr.io/posit-dev"
        run: |
          bakery build --strategy build --push --pull \
            --retry 1 \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS" \
            --temp-registry "$TEMP_REGISTRY" \
            --metadata-file "./${IMAGE_NAME}-${IMAGE_VERSION}-metadata.json"

      - name: Upload metadata
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "${{ matrix.img.image }}-${{ matrix.img.version }}-metadata"
          path: "./${{ matrix.img.image }}-${{ matrix.img.version }}-metadata.json"
          overwrite: 'true'

  merge:
    name: "Merge/Push ${{ matrix.img.image }}:${{ matrix.img.version }}"
    permissions:
      contents: read
      packages: write
      id-token: write
    needs:
      - matrix
      - build
    # Only the push/schedule paths produce temp images to convert. A bare `if:`
    # (no status function) implicitly requires success(), so this also skips
    # when `build` fails. The matrix guard mirrors `build`'s: an empty
    # change-aware matrix would otherwise fail this job rather than skip it.
    if: ${{ needs.matrix.outputs.matrix != '[]' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    # Scopes the AWS_ROLE secret to the production-only role that can push to
    # the customer-facing public ECR repository. This is a distinct
    # role/account from the `development` environment's AWS_ROLE (see
    # development-positron-sagemaker.yml), which can only push to the
    # internal, non-customer-facing ECR repo used for preview builds.
    environment: production
    strategy:
      fail-fast: false
      matrix:
        img: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bakery
        uses: "posit-dev/images-shared/setup-bakery@main"

      # Log in to the temp registry (ghcr, pull source) and both final
      # registries (ghcr + public ECR, push destinations). oras and soci read
      # credentials from the docker config these logins populate.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
        with:
          registry-type: public

      - name: Setup ORAS CLI
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

      - name: Setup SOCI
        uses: "posit-dev/images-shared/setup-soci@main"

      - name: Download metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: "*-metadata"
          merge-multiple: true

      # oras index-create -> soci-convert -> index-copy. Reads the temp images
      # named in the metadata, applies the SOCI index, and lands the result on
      # the final ghcr + public ECR tags.
      - name: Publish with SOCI index
        env:
          GIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ matrix.img.image }}
          TEMP_REGISTRY: "ghcr.io/posit-dev"
        run: |
          bakery ci publish \
            --image-name "^${IMAGE_NAME}$" \
            --temp-registry "$TEMP_REGISTRY" \
            ./*-metadata.json

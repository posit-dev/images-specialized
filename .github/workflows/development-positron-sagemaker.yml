name: Development - Positron SageMaker
# Development builds of the positron-sagemaker image against a Positron DAILY
# build, rather than the pinned release tracked by bakery.yaml's `versions:`
# list (which the "Positron SageMaker" workflow builds). Runs on a daily
# schedule, and on demand via workflow_dispatch.
#
# Version selection:
#   * Leave `version` empty (the default) and Bakery discovers the current head
#     of the Positron daily channel for you.
#   * Set `version` to pin an exact daily (e.g. 2026.09.0-108) — useful for
#     reproducing a bug against an older daily, or for testing a specific build.
#
# Where the version comes from: Bakery resolves Positron dailies from the
# Positron *pwb* manifest (cdn.posit.co/positron/dailies/pwb/<arch>/releases.json),
# while this image downloads the *server* flavor of the same build. Both flavors
# are published from the same commit under the same version string, so the pwb
# manifest is a valid discovery source for the server tarball. See the
# devVersions comment in bakery.yaml.
#
# Where the images go: bakery.yaml's devVersions block sets overrideRegistries,
# so dev builds are tagged ONLY for ghcr.io/posit-dev/positron-sagemaker-preview
# and the internal 935931255537.dkr.ecr.us-east-2.amazonaws.com/positron-sagemaker-preview
# repo. They can never reach the customer-facing public.ecr.aws repository. The
# sagemaker-distribution base image still pulls anonymously from ECR Public,
# exactly as it does in the production workflow's Build step, but the Push step
# now assumes the `development` environment's AWS_ROLE to authenticate against
# the private ECR repo -- a separate role/account from the `production`
# environment's AWS_ROLE used by the Positron SageMaker workflow, which only
# has push access to the public ECR repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Positron daily version to build (e.g. 2026.09.0-108). Omit to build the latest daily."
        required: false
        type: string
      channel:
        description: "Positron development channel to build from."
        required: false
        type: choice
        options:
          - daily
        default: daily
      push:
        description: "Push the built image to the ghcr preview repository. Only ever takes effect on main."
        required: false
        type: boolean
        default: true

  schedule:
    # Daily rebuild against the current Positron daily. Positron publishes its
    # dailies in the evening UTC (~18:30), so an 08:30 run picks up the previous
    # evening's build rather than racing the publish. Also lands after this
    # repo's Positron version check (04:30) and clear of the weekly
    # specialized-hour rebuilds (03:45-04:45 Sunday), and matches the 07-09 UTC
    # band images-workbench uses for its own daily dev builds.
    - cron: "30 8 * * *" # At 08:30 every day

concurrency:
  group: positron-sagemaker-development-image-build
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    # This should be the only action checked as required in the repo settings.
    #
    # This is a meta-job, here to express the conditions we require
    # in order to consider a CI run to be successful.
    if: always()

    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    needs:
      - dev

    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        id: alls-green
        with:
          jobs: ${{ toJSON(needs) }}
      - if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: posit-dev/images-shared/.github/actions/slack-build-notify@main
        with:
          result: ${{ steps.alls-green.outcome }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  matrix:
    name: Image Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      dev-spec: ${{ steps.resolve-dev-spec.outputs.dev-spec }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: "posit-dev/images-shared/setup-bakery@main"

      - name: Resolve dev-spec
        id: resolve-dev-spec
        # Forwards the DISPATCHED spec (empty when no version was supplied), not
        # the version Bakery ends up resolving.
        #
        # Deliberate: a dev-spec sets version_override, and Bakery treats an
        # overridden version as "not necessarily the channel head" — it suppresses
        # the floating :daily and :daily-ubuntu-24.04 tags even when the pinned
        # version IS the current head. Echoing a resolved version back in here
        # would therefore stop the default run from ever publishing :daily.
        #
        # The cost is that the build job re-resolves "latest daily" independently,
        # so a daily published between the two jobs would no longer match the
        # matrix's --image-version. That case fails loudly (bakery exits 1 with
        # "No image targets matching ..."), so a rollover is a visible re-run,
        # never a silently mismatched build.
        env:
          # On a schedule event there are no inputs at all: version is empty (so
          # no spec is emitted and the build tracks the channel head, which is
          # what a scheduled rebuild wants), and channel must fall back to a
          # valid value — bakery rejects an empty --dev-channel outright.
          DEV_VERSION: ${{ inputs.version }}
          DEV_CHANNEL: ${{ inputs.channel || 'daily' }}
        run: |
          if [[ -n "$DEV_VERSION" ]]; then
            echo "dev-spec=$(jq -cn --arg v "$DEV_VERSION" --arg c "$DEV_CHANNEL" '{version: $v, channel: $c}')" >> "$GITHUB_OUTPUT"
          else
            echo "dev-spec=" >> "$GITHUB_OUTPUT"
          fi

      - name: Images
        id: images
        env:
          DEV_VERSIONS: "only"
          MATRIX_VERSIONS: "exclude"
          IMAGE_NAME: "positron-sagemaker"
          DEV_CHANNEL: ${{ inputs.channel || 'daily' }}
          # Bakery reads the dispatched dev spec from BAKERY_DEV_SPEC. An empty
          # value is treated as unset, which is what makes "omit version to build
          # the latest daily" work without conditional CLI argument assembly.
          BAKERY_DEV_SPEC: ${{ steps.resolve-dev-spec.outputs.dev-spec }}
        run: |
          MATRIX_JSON=$(bakery ci matrix --quiet --dev-versions "$DEV_VERSIONS" --matrix-versions "$MATRIX_VERSIONS" --dev-channel "$DEV_CHANNEL" "$IMAGE_NAME" | jq --compact-output .)
          if [[ "$(echo "$MATRIX_JSON" | jq 'length')" -eq 0 ]]; then
            echo "::error::No development version resolved for ${IMAGE_NAME} on channel '${DEV_CHANNEL}'."
            exit 1
          fi
          echo "Building Positron ${DEV_CHANNEL}: $(echo "$MATRIX_JSON" | jq -r '[.[].version] | join(", ")')"
          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  dev:
    name: "${{ matrix.img.image }}:${{ matrix.img.version }} (dev)"
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: matrix
    runs-on: ubuntu-latest-4x
    # Scopes the AWS_ROLE secret to the development-only role that can push to
    # the internal ECR repo. This is a distinct role/account from the
    # `production` environment's AWS_ROLE (see positron-sagemaker.yml), which
    # can only push to the customer-facing public ECR repository.
    environment: development
    strategy:
      fail-fast: false
      matrix:
        img: ${{ fromJson(needs.matrix.outputs.matrix) }}

    env:
      DEV_VERSIONS: "only"
      MATRIX_VERSIONS: "exclude"
      IMAGE_NAME: ${{ matrix.img.image }}
      IMAGE_VERSION: ${{ matrix.img.version }}
      # The dispatched spec, so Build/Test/Push resolve the same version the
      # matrix job did. Empty on a default run; --image-version below still
      # constrains the build to the exact version this matrix entry names.
      BAKERY_DEV_SPEC: ${{ needs.matrix.outputs.dev-spec }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bakery
        uses: "posit-dev/images-shared/setup-bakery@main"

      - name: Setup goss
        uses: "posit-dev/images-shared/setup-goss@main"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: ${{ (github.event_name == 'schedule' || inputs.push) && github.ref == 'refs/heads/main' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        if: ${{ (github.event_name == 'schedule' || inputs.push) && github.ref == 'refs/heads/main' }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          bakery build --load --pull \
            --retry 1 \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS"

      - name: Test
        run: |
          GOSS_PATH=${GITHUB_WORKSPACE}/tools/goss \
          DGOSS_PATH=${GITHUB_WORKSPACE}/tools/dgoss \
          bakery dgoss run \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS"

      - name: Push
        # Dev images are pushed only from main. Scheduled rebuilds always push —
        # publishing the new daily is the entire point of the schedule, and
        # inputs.push is unset (falsy) on a schedule event, so it cannot be
        # relied on there. Dispatches honour the push input. Destination is the
        # ghcr preview repository (see overrideRegistries in bakery.yaml) — never
        # the public ECR repository.
        if: ${{ (github.event_name == 'schedule' || inputs.push) && github.ref == 'refs/heads/main' }}
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          bakery build --push --pull \
            --retry 1 \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS"
